# RTO state and union-territory codes -- the first two characters of every
# non-BH Indian plate.
#
# This is a whitelist, not a lookup table for display: its job in P3 is to
# reject a two-letter prefix the OCR invented. `MH` is Maharashtra and `NH` is
# nothing, so a read of `NH15HY2237` is known to be wrong before any vehicle is
# searched for.
#
# Retired codes are kept. A plate issued under `OR` in 2010 is still on the road
# and still legal, so dropping the old code would fail a real vehicle.
#
# `BH` is deliberately absent. It is not a state -- it is the Bharat series,
# where the two letters sit at position 2 and the year sits first
# (22BH1234AA), and grammar.py matches it as its own format.

codes:
  AN: Andaman and Nicobar Islands
  AP: Andhra Pradesh
  AR: Arunachal Pradesh
  AS: Assam
  BR: Bihar
  CG: Chhattisgarh
  CH: Chandigarh
  DD: Daman and Diu
  DL: Delhi
  DN: Dadra and Nagar Haveli
  GA: Goa
  GJ: Gujarat
  HP: Himachal Pradesh
  HR: Haryana
  JH: Jharkhand
  JK: Jammu and Kashmir
  KA: Karnataka
  KL: Kerala
  LA: Ladakh
  LD: Lakshadweep
  MH: Maharashtra
  ML: Meghalaya
  MN: Manipur
  MP: Madhya Pradesh
  MZ: Mizoram
  NL: Nagaland
  OD: Odisha
  PB: Punjab
  PY: Puducherry
  RJ: Rajasthan
  SK: Sikkim
  TN: Tamil Nadu
  TR: Tripura
  TS: Telangana
  UK: Uttarakhand
  UP: Uttar Pradesh
  WB: West Bengal

# Still on the road, no longer issued.
retired:
  OR: Odisha            # became OD in 2011
  UA: Uttarakhand       # became UK in 2007
  TG: Telangana         # brief alternate for TS
  CD: Diplomatic corps  # not a state; format differs, listed so it is not "unknown"
